name: Magyar frontvonal-térkép publikálása

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Statikus oldal összeállítása
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp index.html _site/index.html
          touch _site/.nojekyll

          BASE="https://graphs.prima.ovh/data/war-rf-ua"
          curl --fail --silent --show-error --retry 3 "$BASE/frontline-map.json" -o _site/data/frontline-map.json

          CURRENT_YEAR=$(date -u +%Y)
          for YEAR in $(seq 2022 "$CURRENT_YEAR"); do
            echo "Frontvonal-adatok: $YEAR"
            curl --fail --silent --show-error --retry 3 "$BASE/frontline-history-$YEAR.json" -o "_site/data/frontline-history-$YEAR.json" || true
          done

          test -s _site/data/frontline-map.json

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Oldalcsomag feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publikálás
        id: deployment
        uses: actions/deploy-pages@v4
