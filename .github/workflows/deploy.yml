name: Magyar frontvonal-térkép publikálása

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Friss frontvonal-adatok előállítása
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent fast-xml-parser polygon-clipping maplibre-gl@6.12.0
          mkdir -p _site/data _site/vendor
          cp index.html _site/index.html
          cp node_modules/maplibre-gl/dist/maplibre-gl.js _site/vendor/maplibre-gl.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.css _site/vendor/maplibre-gl.css
          touch _site/.nojekyll
          node generate-latest.mjs
          test -s _site/data/latest.json

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Oldalcsomag feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publikálás
        id: deployment
        uses: actions/deploy-pages@v4
